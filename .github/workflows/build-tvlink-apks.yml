name: TVLink Build APKs
on:
  workflow_dispatch:
    inputs:
      scope:
        description: APK untuk dibina
        type: choice
        options: [both, mobile, tv]
        default: both
  workflow_run:
    workflows: [Apply ZIP Patch]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tvlink-build-and-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Resolve source and build scope
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ github.event.workflow_run.head_sha }}
          REQUEST: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          mobile=false
          tv=false
          if [[ "$EVENT" == workflow_dispatch ]]; then
            case "$REQUEST" in
              both) mobile=true; tv=true ;;
              mobile) mobile=true ;;
              tv) tv=true ;;
              *) exit 1 ;;
            esac
          elif git merge-base --is-ancestor "$SOURCE" HEAD; then
            while IFS= read -r commit; do
              if [[ "$(git rev-parse "$commit^")" == "$SOURCE" &&
                    "$(git log -1 --format=%s "$commit")" == 'Apply TVLink patch [zip-applied]' ]]; then
                git checkout --detach "$commit"
                while IFS= read -r -d '' path; do
                  case "$path" in
                    mobile/*) mobile=true ;;
                    tv/*) tv=true ;;
                    shared/*|settings.gradle.kts|build.gradle.kts|gradle.properties) mobile=true; tv=true ;;
                  esac
                done < <(git diff --name-only --no-renames -z "$SOURCE" "$commit")
                break
              fi
            done < <(git rev-list --first-parent --reverse "$SOURCE..HEAD")
          fi
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "tv=$tv" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        if: steps.scope.outputs.mobile == 'true' || steps.scope.outputs.tv == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.scope.outputs.mobile == 'true' || steps.scope.outputs.tv == 'true'
        with:
          gradle-version: '8.9'

      - name: Build, sign and verify APKs
        if: steps.scope.outputs.mobile == 'true' || steps.scope.outputs.tv == 'true'
        shell: bash
        env:
          MOBILE: ${{ steps.scope.outputs.mobile }}
          TV: ${{ steps.scope.outputs.tv }}
          TVLINK_KEYSTORE_BASE64: ${{ secrets.TVLINK_KEYSTORE_BASE64 }}
          TVLINK_KEYSTORE_PASSWORD: ${{ secrets.TVLINK_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$TVLINK_KEYSTORE_BASE64" || -z "$TVLINK_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Set TVLINK_KEYSTORE_BASE64 and TVLINK_KEYSTORE_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          umask 077
          signing_dir="$(mktemp -d "${RUNNER_TEMP:?}/tvlink-signing.XXXXXX")"
          trap 'rm -rf -- "$signing_dir"' EXIT
          keystore="$signing_dir/tvlink.p12"
          printf '%s' "$TVLINK_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset TVLINK_KEYSTORE_BASE64
          keytool -list -storetype PKCS12 -keystore "$keystore" -alias tvlink \
            -storepass:env TVLINK_KEYSTORE_PASSWORD >/dev/null
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK unavailable}}"
          missing=()
          if [[ ! -s "$sdk/platforms/android-35/android.jar" ]]; then
            missing+=('platforms;android-35')
          fi
          if [[ ! -x "$sdk/build-tools/34.0.0/apksigner" ]]; then
            missing+=('build-tools;34.0.0')
          fi
          if (( ${#missing[@]} )); then
            sdkmanager_bin="$(command -v sdkmanager || true)"
            if [[ -z "$sdkmanager_bin" ]]; then
              for candidate in "$sdk/cmdline-tools/latest/bin/sdkmanager" "$sdk"/cmdline-tools/*/bin/sdkmanager; do
                if [[ -x "$candidate" ]]; then
                  sdkmanager_bin="$candidate"
                  break
                fi
              done
            fi
            if [[ -z "$sdkmanager_bin" ]]; then
              echo "::error::Android SDK packages missing (${missing[*]}) and sdkmanager was not found under $sdk/cmdline-tools."
              exit 1
            fi
            "$sdkmanager_bin" --sdk_root="$sdk" --install "${missing[@]}"
          fi
          tasks=()
          if [[ "$MOBILE" == true ]]; then tasks+=(:mobile:assembleDebug); fi
          if [[ "$TV" == true ]]; then tasks+=(:tv:assembleDebug); fi
          env -u TVLINK_KEYSTORE_PASSWORD gradle "${tasks[@]}" --stacktrace
          mkdir -p dist
          for module in mobile tv; do
            if [[ "$module" == mobile && "$MOBILE" != true ]] || [[ "$module" == tv && "$TV" != true ]]; then
              continue
            fi
            apk="$module/build/outputs/apk/debug/$module-debug.apk"
            signed_apk="dist/TVLink-${module^^}-debug.apk"
            apksigner="$sdk/build-tools/34.0.0/apksigner"
            "$apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias tvlink \
              --ks-pass env:TVLINK_KEYSTORE_PASSWORD --key-pass env:TVLINK_KEYSTORE_PASSWORD \
              --out "$signed_apk" "$apk"
            "$apksigner" verify --print-certs "$signed_apk"
          done

      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.mobile == 'true'
        with:
          name: TVLink-MOBILE-debug
          path: dist/TVLink-MOBILE-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.tv == 'true'
        with:
          name: TVLink-TV-debug
          path: dist/TVLink-TV-debug.apk
          if-no-files-found: error

      - name: Publish signed updates
        if: (github.event_name == 'workflow_run' || github.ref_name == 'main') && (steps.scope.outputs.mobile == 'true' || steps.scope.outputs.tv == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$(git rev-parse HEAD)" != "$current" ]]; then
            echo "::error::Main changed during this build. Run the build again on main to publish."
            exit 1
          fi
          if ! gh release view tvlink-dev >/dev/null 2>&1; then
            gh release create tvlink-dev --target "$(git rev-parse HEAD)" --title 'TVLink Dev' --prerelease
          fi
          for module in mobile tv; do
            apk="dist/TVLink-${module^^}-debug.apk"
            [[ -f "$apk" ]] || continue
            feed=update.json
            if [[ "$module" == tv ]]; then feed=tv-update.json; fi
            sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK unavailable}}"
            aapt="$sdk/build-tools/34.0.0/aapt"
            badging="$("$aapt" dump badging "$apk")"
            export VERSION_CODE VERSION_NAME
            VERSION_CODE="$(sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" <<< "$badging")"
            VERSION_NAME="$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<< "$badging")"
            [[ "$VERSION_CODE" =~ ^[0-9]+$ && -n "$VERSION_NAME" ]]
            asset="TVLink-${module^^}-$VERSION_CODE.apk"
            existing="$(gh release view tvlink-dev --json assets --jq '.assets[].name')"
            if ! grep -Fxq -- "$asset" <<< "$existing"; then
              cp "$apk" "dist/$asset"
              gh release upload tvlink-dev "dist/$asset"
            fi
            export UPDATE_ASSET="$asset"
            python3 -c 'import json,os; e=os.environ; print(json.dumps(dict(versionCode=int(e["VERSION_CODE"]),versionName=e["VERSION_NAME"],downloadUrl="https://github.com/"+e["GITHUB_REPOSITORY"]+"/releases/download/tvlink-dev/"+e["UPDATE_ASSET"])))' > "dist/$feed"
            gh release upload tvlink-dev "dist/$feed" --clobber
          done
