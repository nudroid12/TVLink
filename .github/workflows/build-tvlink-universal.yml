name: TVLink Universal Build
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'tv/**'
      - 'universal/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:
  workflow_run:
    workflows: [Apply ZIP Patch]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tvlink-universal-build-and-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build and sign Universal APK
        shell: bash
        env:
          TVLINK_KEYSTORE_BASE64: ${{ secrets.TVLINK_KEYSTORE_BASE64 }}
          TVLINK_KEYSTORE_PASSWORD: ${{ secrets.TVLINK_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$TVLINK_KEYSTORE_BASE64" || -z "$TVLINK_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Set TVLINK_KEYSTORE_BASE64 and TVLINK_KEYSTORE_PASSWORD in GitHub Actions secrets."
            exit 1
          fi
          umask 077
          signing_dir="$(mktemp -d "${RUNNER_TEMP:?}/tvlink-signing.XXXXXX")"
          trap 'rm -rf -- "$signing_dir"' EXIT
          keystore="$signing_dir/tvlink.p12"
          printf '%s' "$TVLINK_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset TVLINK_KEYSTORE_BASE64
          keytool -list -storetype PKCS12 -keystore "$keystore" -alias tvlink \
            -storepass:env TVLINK_KEYSTORE_PASSWORD >/dev/null
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK unavailable}}"
          missing=()
          if [[ ! -s "$sdk/platforms/android-35/android.jar" ]]; then
            missing+=('platforms;android-35')
          fi
          if [[ ! -x "$sdk/build-tools/34.0.0/apksigner" ]]; then
            missing+=('build-tools;34.0.0')
          fi
          if (( ${#missing[@]} )); then
            sdkmanager_bin="$(command -v sdkmanager || true)"
            if [[ -z "$sdkmanager_bin" ]]; then
              for candidate in "$sdk/cmdline-tools/latest/bin/sdkmanager" "$sdk"/cmdline-tools/*/bin/sdkmanager; do
                if [[ -x "$candidate" ]]; then
                  sdkmanager_bin="$candidate"
                  break
                fi
              done
            fi
            if [[ -z "$sdkmanager_bin" ]]; then
              echo "::error::Android SDK packages missing (${missing[*]}) and sdkmanager was not found under $sdk/cmdline-tools."
              exit 1
            fi
            "$sdkmanager_bin" --sdk_root="$sdk" --install "${missing[@]}"
          fi
          env -u TVLINK_KEYSTORE_PASSWORD gradle :universal:assembleRelease -PuniversalVersionCode="$GITHUB_RUN_NUMBER" --stacktrace
          mkdir -p dist
          apksigner="$sdk/build-tools/34.0.0/apksigner"
          "$apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias tvlink \
            --ks-pass env:TVLINK_KEYSTORE_PASSWORD --key-pass env:TVLINK_KEYSTORE_PASSWORD \
            --out dist/TVLink-Universal.apk universal/build/outputs/apk/release/universal-release-unsigned.apk
          "$apksigner" verify --print-certs dist/TVLink-Universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TVLink-Universal
          path: dist/TVLink-Universal.apk
          if-no-files-found: error
      - name: Publish Universal update
        if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=tvlink-universal
          apk=dist/TVLink-Universal.apk
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$(git rev-parse HEAD)" --title 'TVLink Universal' --prerelease
          fi
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          if grep -Fxq -- universal-update.json <<< "$assets"; then
            gh release download "$tag" --pattern universal-update.json --output dist/current.json
            current="$(jq -er '.versionCode | select(type == "number")' dist/current.json)"
            if (( current >= GITHUB_RUN_NUMBER )); then exit 0; fi
          fi
          asset="TVLink-UNIVERSAL-$GITHUB_RUN_NUMBER.apk"
          if grep -Fxq -- "$asset" <<< "$assets"; then
            gh release download "$tag" --pattern "$asset" --output dist/published.apk
            cmp "$apk" dist/published.apk
          else
            cp "$apk" "dist/$asset"
            gh release upload "$tag" "dist/$asset"
          fi
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' universal/build.gradle.kts)"
          [[ -n "$version" ]]
          jq -n --argjson code "$GITHUB_RUN_NUMBER" --arg version "$version" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset" \
            '{versionCode: $code, versionName: $version, downloadUrl: $url}' > dist/universal-update.json
          gh release upload "$tag" dist/universal-update.json --clobber
